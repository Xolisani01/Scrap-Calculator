<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wire Extrusion Scrap Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:1000px;
    background:#fff;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:25px;
}

.info-box{
    background:#eef4ff;
    padding:15px;
    border-left:5px solid #1e3a8a;
    margin-bottom:25px;
    border-radius:8px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:6px;
    font-weight:600;
}

input{
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#1e3a8a;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0f2664;
}

.results{
    margin-top:25px;
    display:none;
}

.card{
    background:#f8fafc;
    padding:15px;
    margin-bottom:12px;
    border-radius:10px;
    border-left:5px solid #2563eb;
}

.value{
    font-size:22px;
    font-weight:bold;
    color:#1e3a8a;
}

.download-btn{
    background:#16a34a;
}

.download-btn:hover{
    background:#0f7f37;
}

@media(max-width:700px){
    .form-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>WIRE EXTRUSION SCRAP CALCULATOR</h1>

<div class="info-box">
<strong>Process Constant:</strong><br>
25 kg PVC + 0.75 kg Colour = 5000 m Extruded Wire
</div>

<div class="form-grid">

<div class="input-group">
<label>Date</label>
<input type="date" id="scrapDate">
</div>

<div class="input-group">
<label>Wire Length Produced (Meters)</label>
<input type="number" id="length">
</div>

<div class="input-group">
<label>PVC Loaded / Issued (kg)</label>
<input type="number" id="pvcLoaded">
</div>

<div class="input-group">
<label>PVC Remaining (kg)</label>
<input type="number" id="pvcRemaining">
</div>

<div class="input-group">
<label>Plurge Out PVC / Lost PVC With Colour (kg)</label>
<input type="number" id="plurgePVC">
</div>

<div class="input-group">
<label>Shine Wire Weight (kg)</label>
<input type="number" id="shine">
</div>

<div class="input-group">
<label>Insulated Wire Weight (kg)</label>
<input type="number" id="insulated">
</div>

<div class="input-group">
<label>PVC Stock Code</label>
<input type="text" id="pvcCode">
</div>

<div class="input-group">
<label>Wire Stock Code</label>
<input type="text" id="wireCode">
</div>

</div>

<button onclick="calculateScrap()">
Calculate Scrap
</button>

<button class="download-btn" onclick="downloadScrapSheet()">
Download Scrap Sheet
</button>

<div class="results" id="results">

<div class="card">
PVC Used
<div class="value" id="pvcUsedResult"></div>
</div>

<div class="card">
Expected PVC Consumption
<div class="value" id="expectedPVC"></div>
</div>

<div class="card">
Expected Colour Consumption
<div class="value" id="expectedColour"></div>
</div>

<div class="card">
Plurge Out PVC / Lost PVC
<div class="value" id="plurgeResult"></div>
</div>

<div class="card">
PVC Scrap / Loss
<div class="value" id="scrapKg"></div>
</div>

<div class="card">
Wire Scrap
<div class="value" id="wireScrap"></div>
</div>

<div class="card">
Scrap Percentage
<div class="value" id="scrapPercent"></div>
</div>

<div class="card">
Yield Percentage
<div class="value" id="yieldPercent"></div>
</div>

<div class="card">
Material Conversion Efficiency
<div class="value" id="efficiency"></div>
</div>

</div>

</div>

<script>

let calculatedPVCScrap = 0;
let calculatedWireScrap = 0;

function calculateScrap(){

    let length = parseFloat(document.getElementById('length').value) || 0;
    let pvcLoaded = parseFloat(document.getElementById('pvcLoaded').value) || 0;
    let pvcRemaining = parseFloat(document.getElementById('pvcRemaining').value) || 0;
    let plurgePVC = parseFloat(document.getElementById('plurgePVC').value) || 0;
    let shine = parseFloat(document.getElementById('shine').value) || 0;
    let insulated = parseFloat(document.getElementById('insulated').value) || 0;

    let pvcUsed = pvcLoaded - pvcRemaining;

    if(pvcUsed < 0){
        alert("Remaining PVC cannot be greater than Loaded PVC");
        return;
    }

    const pvcPerMeter = 25 / 5000;
    const colourPerMeter = 0.75 / 5000;

    let expectedPVC = length * pvcPerMeter;
    let expectedColour = length * colourPerMeter;

    calculatedPVCScrap = Math.max(
        0,
        (pvcUsed - expectedPVC) + plurgePVC
    );

    calculatedWireScrap = Math.max(
        0,
        shine - insulated
    );

    let scrapPercent =
        pvcUsed > 0 ?
        (calculatedPVCScrap / pvcUsed) * 100 :
        0;

    let yieldPercent =
        pvcUsed > 0 ?
        (expectedPVC / pvcUsed) * 100 :
        0;

    let efficiency =
        shine > 0 ?
        (insulated / shine) * 100 :
        0;

    document.getElementById('results').style.display = 'block';

    document.getElementById('pvcUsedResult').innerHTML =
        pvcUsed.toFixed(3) + ' kg';

    document.getElementById('expectedPVC').innerHTML =
        expectedPVC.toFixed(3) + ' kg';

    document.getElementById('expectedColour').innerHTML =
        expectedColour.toFixed(3) + ' kg';

    document.getElementById('plurgeResult').innerHTML =
        plurgePVC.toFixed(3) + ' kg';

    document.getElementById('scrapKg').innerHTML =
        calculatedPVCScrap.toFixed(3) + ' kg';

    document.getElementById('wireScrap').innerHTML =
        calculatedWireScrap.toFixed(3) + ' kg';

    document.getElementById('scrapPercent').innerHTML =
        scrapPercent.toFixed(2) + ' %';

    document.getElementById('yieldPercent').innerHTML =
        yieldPercent.toFixed(2) + ' %';

    document.getElementById('efficiency').innerHTML =
        efficiency.toFixed(2) + ' %';
}

function downloadScrapSheet(){

    let date =
        document.getElementById('scrapDate').value;

    let pvcCode =
        document.getElementById('pvcCode').value.trim();

    let wireCode =
        document.getElementById('wireCode').value.trim();

    if(!date){
        alert("Please select a date.");
        return;
    }

    if(!pvcCode){
        alert("Please enter PVC Stock Code.");
        return;
    }

    if(!wireCode){
        alert("Please enter Wire Stock Code.");
        return;
    }

    const rows = [
        ["DATE","MACHINE","STOCK CODE","QTY"],
        [
            date,
            "M70 Extrusion Machine",
            pvcCode,
            calculatedPVCScrap.toFixed(3)
        ],
        [
            date,
            "M70 Extrusion Machine",
            wireCode,
            calculatedWireScrap.toFixed(3)
        ]
    ];

    let csvContent =
        rows.map(e => e.join(",")).join("\n");

    let blob = new Blob(
        [csvContent],
        {type:"text/csv;charset=utf-8;"}
    );

    let link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        "M70_Scrap_Sheet_" + date + ".csv";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
}

</script>

</body>
</html>
